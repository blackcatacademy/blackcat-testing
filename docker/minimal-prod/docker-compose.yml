services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: blackcat_test
      MARIADB_USER: blackcat
      MARIADB_PASSWORD: blackcat
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  db_init:
    image: mariadb:11
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -lc
      - |
        set -e
        echo "[db_init] creating read-only DB user (if missing)"
        mariadb -h db -uroot -proot blackcat_test -e "
          CREATE USER IF NOT EXISTS 'blackcat_ro'@'%' IDENTIFIED BY 'blackcat_ro';
          GRANT SELECT, SHOW VIEW ON blackcat_test.* TO 'blackcat_ro'@'%';
          FLUSH PRIVILEGES;
        "
        echo "[db_init] done"
    restart: "no"

  app:
    build:
      context: ../../..
      dockerfile: blackcat-testing/docker/minimal-prod/app/Dockerfile
    environment:
      BLACKCAT_TRUST_CHAIN_ID: "${BLACKCAT_TRUST_CHAIN_ID:-4207}"
      # NOTE: EdgenScan RPC is rate-limited and can return HTTP 429, which breaks strict quorum demos.
      # For a reliable localhost demo, default to the official RPC and quorum=1.
      # If you have multiple stable RPC endpoints, override both vars to enable quorum>=2.
      BLACKCAT_TRUST_RPC_ENDPOINTS: "${BLACKCAT_TRUST_RPC_ENDPOINTS:-https://rpc.layeredge.io}"
      BLACKCAT_TRUST_RPC_QUORUM: "${BLACKCAT_TRUST_RPC_QUORUM:-1}"
      # Runtime enforcement: strict (fail-closed) vs warn (demo-friendly; allows quorum=1).
      BLACKCAT_TRUST_ENFORCEMENT: "${BLACKCAT_TRUST_ENFORCEMENT:-warn}"
      BLACKCAT_TRUST_MODE: "${BLACKCAT_TRUST_MODE:-full}"
      BLACKCAT_TRUST_MAX_STALE_SEC: "${BLACKCAT_TRUST_MAX_STALE_SEC:-180}"
      BLACKCAT_TRUST_TIMEOUT_SEC: "${BLACKCAT_TRUST_TIMEOUT_SEC:-3}"
      # Default controller for the demo (Edgen). Override to test another instance.
      # NOTE: This demo controller is owned by the demo operator EOA and is provisioned for quorum=1 + v3 warn policy.
      BLACKCAT_INSTANCE_CONTROLLER: "${BLACKCAT_INSTANCE_CONTROLLER:-0x1D8956918DE3D2D58f8B596E4e8e826265cB390A}"
      # Optional ReleaseRegistry pointer (set to 0x0 for demo instances that disable ReleaseRegistry checks on-chain).
      BLACKCAT_RELEASE_REGISTRY: "${BLACKCAT_RELEASE_REGISTRY:-0x0000000000000000000000000000000000000000}"
      BLACKCAT_DB_DSN: "${BLACKCAT_DB_DSN:-mysql:host=db;dbname=blackcat_test;charset=utf8mb4}"
      BLACKCAT_DB_USER: "${BLACKCAT_DB_USER:-blackcat}"
      BLACKCAT_DB_PASS: "${BLACKCAT_DB_PASS:-blackcat}"
      BLACKCAT_TESTING_BOOT_MODE: "${BLACKCAT_TESTING_BOOT_MODE:-run}"
      BLACKCAT_TESTING_FORCE_PROVISION: "${BLACKCAT_TESTING_FORCE_PROVISION:-1}"
      BLACKCAT_TESTING_EXIT_AFTER_TAMPER: "${BLACKCAT_TESTING_EXIT_AFTER_TAMPER:-0}"
      BLACKCAT_TESTING_ENABLE_SECRETS_AGENT: "${BLACKCAT_TESTING_ENABLE_SECRETS_AGENT:-1}"
      # Default: do NOT auto-tamper. Enable explicitly for the fail-closed demo.
      BLACKCAT_TESTING_TAMPER_AFTER_SEC: "${BLACKCAT_TESTING_TAMPER_AFTER_SEC:-0}"
      BLACKCAT_TESTING_TAMPER_KIND: "${BLACKCAT_TESTING_TAMPER_KIND:-unexpected_file}"
      # Addresses-only list for the investor demo. Prefer env list; fallback is a baked-in JSON file.
      BLACKCAT_TESTING_DEMO_WALLETS: "${BLACKCAT_TESTING_DEMO_WALLETS:-}"
      BLACKCAT_TESTING_DEMO_WALLETS_FILE: "${BLACKCAT_TESTING_DEMO_WALLETS_FILE:-/opt/blackcat/demo-public/demo.wallets.public.json}"
      BLACKCAT_TESTING_RPC_SABOTAGE_AFTER_SEC: "${BLACKCAT_TESTING_RPC_SABOTAGE_AFTER_SEC:-0}"
      BLACKCAT_TESTING_LOCAL_RPC_PROXY: "${BLACKCAT_TESTING_LOCAL_RPC_PROXY:-0}"
      BLACKCAT_TESTING_RPC_PROXY_PORT: "${BLACKCAT_TESTING_RPC_PROXY_PORT:-8545}"
      BLACKCAT_TESTING_RPC_PROXY_UPSTREAM: "${BLACKCAT_TESTING_RPC_PROXY_UPSTREAM:-https://rpc.layeredge.io}"
      BLACKCAT_TESTING_RPC_PROXY_SABOTAGE_AFTER_SEC: "${BLACKCAT_TESTING_RPC_PROXY_SABOTAGE_AFTER_SEC:-0}"
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - blackcat_etc:/etc/blackcat
      - blackcat_var:/var/lib/blackcat
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully

  runner:
    image: minimal-prod-app
    entrypoint: ["php", "/srv/blackcat/site/bin/trust-runner.php"]
    environment:
      BLACKCAT_TRUST_RUNNER_INTERVAL_SEC: "${BLACKCAT_TRUST_RUNNER_INTERVAL_SEC:-5}"
      BLACKCAT_TRUST_RUNNER_LOG_EVERY_SEC: "${BLACKCAT_TRUST_RUNNER_LOG_EVERY_SEC:-30}"
      # Optional: on-chain tx intents (broadcast requires relayer).
      BLACKCAT_TRUST_RUNNER_CHECKIN_INTERVAL_SEC: "${BLACKCAT_TRUST_RUNNER_CHECKIN_INTERVAL_SEC:-0}"
      BLACKCAT_TRUST_RUNNER_AUDIT_ANCHOR_INTERVAL_SEC: "${BLACKCAT_TRUST_RUNNER_AUDIT_ANCHOR_INTERVAL_SEC:-0}"
      # Optional: best-effort FS scan (recommended for writable dirs).
      BLACKCAT_TRUST_RUNNER_FS_SCAN_INTERVAL_SEC: "${BLACKCAT_TRUST_RUNNER_FS_SCAN_INTERVAL_SEC:-60}"
      BLACKCAT_TRUST_RUNNER_FS_SCAN_DIRS: "${BLACKCAT_TRUST_RUNNER_FS_SCAN_DIRS:-/var/lib/blackcat,/etc/blackcat}"
      # Optional: queue on-chain incident intents (enabled by default).
      BLACKCAT_TRUST_RUNNER_EMIT_INCIDENTS: "${BLACKCAT_TRUST_RUNNER_EMIT_INCIDENTS:-1}"
      # Testing-only: exit runner to simulate crash (enables stale check-in auto-pause demos).
      BLACKCAT_TESTING_RUNNER_EXIT_AFTER_SEC: "${BLACKCAT_TESTING_RUNNER_EXIT_AFTER_SEC:-0}"
      BLACKCAT_TESTING_RPC_SABOTAGE_AFTER_SEC: "${BLACKCAT_TESTING_RPC_SABOTAGE_AFTER_SEC:-0}"
    volumes:
      - blackcat_etc:/etc/blackcat
      - blackcat_var:/var/lib/blackcat
    depends_on:
      app:
        condition: service_started

  attacker:
    profiles: ["attack"]
    build:
      context: ../../..
      dockerfile: blackcat-testing/docker/minimal-prod/attacker/Dockerfile
    environment:
      TARGET_BASE_URL: "${TARGET_BASE_URL:-http://app:8080}"
      ATTACK_DURATION_SEC: "${ATTACK_DURATION_SEC:-120}"
      ATTACK_RPS: "${ATTACK_RPS:-5}"
      # Tamper is disabled by default (enable explicitly via scenario overrides).
      TAMPER_AFTER_SEC: "0"
      ATTACK_LOG_DIR: "${ATTACK_LOG_DIR:-/var/log/blackcat-testing}"
      ATTACK_LOG_EVERY_SEC: "${ATTACK_LOG_EVERY_SEC:-1}"
      ATTACK_READY_TIMEOUT_SEC: "${ATTACK_READY_TIMEOUT_SEC:-60}"
      ATTACK_MAX_CONSECUTIVE_HEALTH_FAILS: "${ATTACK_MAX_CONSECUTIVE_HEALTH_FAILS:-30}"
      EXPECT_TRUST_OK_AT_START: "${EXPECT_TRUST_OK_AT_START:-0}"
      EXPECT_TRUST_FAIL_AFTER_TAMPER: "${EXPECT_TRUST_FAIL_AFTER_TAMPER:-1}"
      EXPECT_STALE_READS_ON_RPC_OUTAGE: "${EXPECT_STALE_READS_ON_RPC_OUTAGE:-0}"
      EXPECT_HEALTH_DOWN_AFTER_TAMPER: "${EXPECT_HEALTH_DOWN_AFTER_TAMPER:-0}"
    volumes:
      - blackcat_harness_logs:/var/log/blackcat-testing
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  blackcat_etc: {}
  blackcat_var: {}
  blackcat_harness_logs: {}
  blackcat_harness_reports: {}
  blackcat_operator_shared: {}
