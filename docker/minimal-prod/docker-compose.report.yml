services:
  report:
    image: minimal-prod-app
    entrypoint: ["php", "/srv/blackcat/site/bin/soak-report.php"]
    environment:
      BLACKCAT_SOAK_RUN_ID: "${BLACKCAT_SOAK_RUN_ID:-}"
      BLACKCAT_SOAK_LOG_DIR: "${BLACKCAT_SOAK_LOG_DIR:-/var/lib/blackcat/harness/logs}"
      BLACKCAT_SOAK_REPORT_OUT_DIR: "${BLACKCAT_SOAK_REPORT_OUT_DIR:-/var/lib/blackcat/harness/reports}"
      BLACKCAT_CONFIG_PATH: "${BLACKCAT_CONFIG_PATH:-/etc/blackcat/config.runtime.json}"
    volumes:
      - blackcat_etc:/etc/blackcat:ro
      - blackcat_var:/var/lib/blackcat:ro
      - blackcat_harness_logs:/var/lib/blackcat/harness/logs:ro
      - blackcat_harness_reports:/var/lib/blackcat/harness/reports
