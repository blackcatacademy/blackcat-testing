services:
  app:
    environment:
      BLACKCAT_TESTING_INSECURE_URL: "${BLACKCAT_TESTING_INSECURE_URL:-http://localhost:8089/}"
      BLACKCAT_TESTING_DEMO_WALLETS_FILE: "${BLACKCAT_TESTING_DEMO_WALLETS_FILE:-/etc/blackcat/demo-public/demo.wallets.public.json}"
    volumes:
      # Public demo wallet addresses (NO private keys). Mounted read-only.
      # Keep /etc/blackcat/demo writable for demo runtime state (e.g., demo.state.json).
      - ../../var/demo/public:/etc/blackcat/demo-public:ro
      # Presentation-only: expose attacker harness logs/reports inside open_basedir-safe roots.
      - ../../var/harness/minimal-prod/logs:/var/lib/blackcat/harness/logs:ro
      - ../../var/harness/minimal-prod/reports:/var/lib/blackcat/harness/reports

  insecure:
    build:
      context: ../../..
      dockerfile: blackcat-testing/docker/minimal-prod/insecure/Dockerfile
    environment:
      DB_DSN: "${BLACKCAT_DB_DSN:-mysql:host=db;dbname=blackcat_test;charset=utf8mb4}"
      DB_USER: "${BLACKCAT_DB_USER:-blackcat}"
      DB_PASS: "${BLACKCAT_DB_PASS:-blackcat}"
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      db:
        condition: service_healthy
